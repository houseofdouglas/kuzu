[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-manager"
version = "0.1.0"
description = "Kuzu-backed spec graph management for Claude agents"
requires-python = ">=3.10"
dependencies = [
    "kuzu>=0.5.0",
    "fastmcp>=3.0",
]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
spec-manager = "spec_manager.cli:main"

[tool.setuptools.packages.find]
include = ["spec_manager*"]

[tool.setuptools.package-data]
"spec_manager.presets" = ["**/*.cypher", "**/*.json"]
"spec_manager.agents" = ["*.md"]
